name: Upload API docs
description: |
  Publishes docs/postman-collection.json to the Postman workspace and docs/openapi/openapi.json
  to the Scalar Registry (`pnpm docs:upload`, `pnpm docs:upload:scalar`). Best-effort: a
  registry outage never fails the caller. Credential gating lives inside the upload scripts
  (shouldSkipHostedUpload): they log "Skipping…" and exit 0 when a key is unset — an `if:` on a
  step's own secret env never worked, because GitHub evaluates `if:` before it fills that env.

  Used by reusable-openapi-postman-publish.yml and by reusable-railway-deploy.yml after a live
  production deploy (`api_docs_artifact`).

inputs:
  postman-api-key:
    description: POSTMAN_API_KEY (a secret)
    required: false
    default: ''
  postman-workspace-id:
    description: POSTMAN_WORKSPACE_ID (a secret)
    required: false
    default: ''
  scalar-api-key:
    description: SCALAR_API_KEY (a secret)
    required: false
    default: ''
  scalar-namespace:
    description: SCALAR_NAMESPACE — part of the public registry URL, so a GitHub Variable
    required: false
    default: ''
  scalar-slug:
    description: SCALAR_SLUG — part of the public registry URL, so a GitHub Variable
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Upload Postman Collection to workspace
      shell: bash
      continue-on-error: true
      env:
        POSTMAN_API_KEY: ${{ inputs.postman-api-key }}
        POSTMAN_WORKSPACE_ID: ${{ inputs.postman-workspace-id }}
      run: pnpm docs:upload

    - name: Upload OpenAPI to Scalar Registry
      shell: bash
      continue-on-error: true
      env:
        SCALAR_API_KEY: ${{ inputs.scalar-api-key }}
        SCALAR_NAMESPACE: ${{ inputs.scalar-namespace }}
        SCALAR_SLUG: ${{ inputs.scalar-slug }}
      run: pnpm docs:upload:scalar
