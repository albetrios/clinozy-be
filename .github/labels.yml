# Every GitHub label for this repository: name + color (pastel) + description —
# including the label workflows create and GitHub's built-in ones, so nothing is
# left at GitHub's default gray once these are applied to the repository.
# Path-based attachment to PRs is handled by .github/labeler.yml; create/update
# these labels on GitHub when label names, colors, or descriptions change.
#
# When adding a new domain:
#   1. Add a `domain:<new>` entry under "Domains" below (keep alphabetised).
#   2. Add the same key in .github/labeler.yml with its glob.
#
# Colors are 6-digit hex without `#` (GitHub label format). The sections up to PR
# size use Material's 100 tones; tracked issues and GitHub's defaults use the 200
# tone of their hue, so they stay pastel but read as their own group. The colors
# match clinozy-fe's labels.yml for every label the two repositories share.

# ---------- Domains (pastel rainbow — one hue per domain) ----------

- name: 'domain:audit'
  color: 'E1BEE7'
  description: 'Audit log, retention and export (src/domains/audit)'

- name: 'domain:auth'
  color: 'F8BBD0'
  description: 'Authentication, sessions, magic-link, MFA, passkeys (src/domains/auth)'

- name: 'domain:billing'
  color: 'C8E6C9'
  description: 'Plans, subscriptions and Stripe webhook (src/domains/billing)'

- name: 'domain:notify'
  color: 'FFE0B2'
  description: 'Notifications and webhook delivery (src/domains/notify)'

- name: 'domain:tenancy'
  color: 'BBDEFB'
  description: 'Organizations, membership, roles and permissions (src/domains/tenancy)'

- name: 'domain:upload'
  color: 'B2EBF2'
  description: 'File uploads and storage (src/domains/upload)'

- name: 'domain:user'
  color: 'FFF9C4'
  description: 'User profile, settings, notification prefs, GDPR export (src/domains/user)'

# ---------- Layers ----------

- name: 'infrastructure'
  color: 'D7CCC8'
  description: 'Cross-domain runtime: database, cache, queue, mail, payment, storage, observability'

- name: 'shared'
  color: 'CFD8DC'
  description: 'Shared utils, middlewares, config, errors, locales (src/shared)'

# ---------- Concerns ----------

- name: 'ci'
  color: 'F0F4C3'
  description: 'GitHub Actions workflows, composite actions, rulesets'

- name: 'tests'
  color: 'B2DFDB'
  description: 'Vitest, k6, chaos, contract and integration suites'

- name: 'docs'
  color: 'FFECB3'
  description: 'Hand-written docs under docs/ and top-level *.md'

- name: 'database'
  color: 'DCEDC8'
  description: 'SQL migrations, Drizzle schemas and DB infrastructure'

- name: 'dependencies'
  color: 'D1C4E9'
  description: 'package.json / pnpm lockfile / workspace updates (also set by Dependabot)'

- name: 'docker'
  color: 'B3E5FC'
  description: 'Dockerfile, Compose and image base updates (also set by Dependabot)'

# ---------- PR size (set by .github/workflows/pr-governance.yml) ----------

- name: 'size/small'
  color: 'C8E6C9'
  description: '≤ 50 added+deleted lines'

- name: 'size/medium'
  color: 'FFF9C4'
  description: '51–200 added+deleted lines'

- name: 'size/large'
  color: 'FFE0B2'
  description: '201–500 added+deleted lines'

- name: 'size/x-large'
  color: 'FFCDD2'
  description: '> 500 added+deleted lines — consider splitting'

# ---------- Tracked issues (opened and updated by workflows) ----------

# post-merge-ci.yml and the scheduled guards create it on first use with the same
# color and description (`gh label create ci-failure --color FFAB91 …`).
- name: 'ci-failure'
  color: 'FFAB91'
  description: 'Automated post-merge/guard failure notification'

# ---------- GitHub defaults (the default hue, as a pastel 200 tone) ----------

- name: 'bug'
  color: 'EF9A9A'
  description: "Something isn't working"

- name: 'documentation'
  color: '90CAF9'
  description: 'Improvements or additions to documentation'

- name: 'duplicate'
  color: '9FA8DA'
  description: 'This issue or pull request already exists'

- name: 'enhancement'
  color: '80DEEA'
  description: 'New feature or request'

- name: 'good first issue'
  color: 'B39DDB'
  description: 'Good for newcomers'

- name: 'help wanted'
  color: '80CBC4'
  description: 'Extra attention is needed'

- name: 'invalid'
  color: 'E6EE9C'
  description: "This doesn't seem right"

- name: 'question'
  color: 'CE93D8'
  description: 'Further information is requested'

- name: 'wontfix'
  color: 'BCAAA4'
  description: 'This will not be worked on'
