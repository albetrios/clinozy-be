# Weekly lightweight restore smoke drill — catches restore/migrate regressions 4x faster
# than the monthly RTO drill, without the full RTO overhead. Creates a throwaway Neon PITR
# branch in the GitHub Environment's own Neon project (main → production → project
# <slug>-production, branch production), runs migrate + the non-destructive restore
# smoke, then deletes the branch. No RTO assertion. See docs/process/backup-drills.md.

name: Weekly restore smoke drill

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ${{ vars.FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 || 'true' }}

permissions:
  contents: read

concurrency:
  group: restore-smoke-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-environment:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - name: Map branch to GitHub Environment
        # Single-trunk model (see docs/deployment/runbooks/add-new-environment.md):
        #   main → production   (the only long-lived branch; environment ≠ branch)
        id: map
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$REF_NAME" in
            main) echo "environment=production"  >> "$GITHUB_OUTPUT" ;;
            *)    echo "::error::Unsupported branch for restore drill: ${REF_NAME} (single-trunk: the drill runs from main only)" && exit 1 ;;
          esac

  restore-smoke:
    name: Restore branch — migrate and restore smoke
    needs: [resolve-environment]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.environment }}
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.6.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Each GitHub Environment has its own Neon project; the script derives the project, branch,
      # database and owner names from it (the infrastructure repository's naming rule).
      RESTORE_DRILL_ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}
      NODE_ENV: development
      REDIS_URL: redis://localhost:6379
    # The Neon API key is set only on the steps that call Neon — never job-wide, where every
    # dependency's install script and the test code could read it.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require restore drill secrets
        env:
          MONTHLY_DATABASE_RESTORE_DRILL_NEON_API_KEY: ${{ secrets.MONTHLY_DATABASE_RESTORE_DRILL_NEON_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MONTHLY_DATABASE_RESTORE_DRILL_NEON_API_KEY}" ]; then
            echo "::error::GitHub Environment secret MONTHLY_DATABASE_RESTORE_DRILL_NEON_API_KEY is required (sync via pnpm github:sync)."
            exit 1
          fi

      # Before the branch exists, so the production copy lives only as long as the restore steps.
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Export shared CI test env
        uses: ./.github/actions/test-env

      - name: Provision Neon PITR restore branch
        id: neon_drill
        env:
          MONTHLY_DATABASE_RESTORE_DRILL_NEON_API_KEY: ${{ secrets.MONTHLY_DATABASE_RESTORE_DRILL_NEON_API_KEY }}
        run: bash tooling/ci/restore-drill-neon.sh create

      # Migrations take the direct endpoint (their advisory lock needs one backend); the app pools
      # take the pooled one, as in production.
      - name: Run migrations on restored branch
        env:
          DATABASE_URL: ${{ steps.neon_drill.outputs.application_database_url }}
          DATABASE_MAINTENANCE_URL: ${{ steps.neon_drill.outputs.maintenance_database_url }}
          DATABASE_MIGRATION_URL: ${{ steps.neon_drill.outputs.migration_database_url }}
        run: pnpm db:migrate

      # The DR runbook's step after migrating (docs/process/dr-runbook.md): move every id sequence
      # past what the lost window issued. The smoke below then writes rows with the jumped ids.
      # The script prints each sequence's value — production's row counts — and this repository's
      # Actions logs are public, so only its last line (how many sequences moved) is shown.
      - name: Advance id sequences on restored branch
        env:
          DATABASE_URL: ${{ steps.neon_drill.outputs.application_database_url }}
          DATABASE_MAINTENANCE_URL: ${{ steps.neon_drill.outputs.maintenance_database_url }}
          DATABASE_MIGRATION_URL: ${{ steps.neon_drill.outputs.migration_database_url }}
        run: |
          set -euo pipefail
          pnpm --silent db:sequences:advance | tail -n 1

      # Reads every table, checks the seeded reference rows are there and every id sequence is past
      # its column's ids, then boots the app and signs a new user in and out, into an organization
      # (src/scripts/ops/db-restore-smoke.ts). Never a test suite: their setup truncates every
      # table, and this branch is a copy of production. TEST_MODE makes send-code return the
      # sign-in code (no CAPTCHA in front of it); the drill user goes when the branch is deleted.
      # send-code answers 503 until email is configured, so the step carries the Vitest harness's
      # CI-only fixture key (as the k6 job does), never production's: the email only lands in the
      # outbox and this runner's Redis — this job runs no worker — so nothing is sent.
      - name: Restore smoke on restored database
        env:
          DATABASE_URL: ${{ steps.neon_drill.outputs.application_database_url }}
          DATABASE_MAINTENANCE_URL: ${{ steps.neon_drill.outputs.maintenance_database_url }}
          DATABASE_MIGRATION_URL: ${{ steps.neon_drill.outputs.migration_database_url }}
          TEST_MODE: 'true'
          CAPTCHA_PROVIDER: disabled
          RESEND_API_KEY: re_test_contract_fixture_key
          EMAIL_FROM_ADDRESS: noreply@example.com
        run: pnpm db:restore:smoke

      - name: Delete Neon restore drill branch
        if: always() && steps.neon_drill.outputs.branch_id != ''
        env:
          DRILL_BRANCH_ID: ${{ steps.neon_drill.outputs.branch_id }}
          MONTHLY_DATABASE_RESTORE_DRILL_NEON_API_KEY: ${{ secrets.MONTHLY_DATABASE_RESTORE_DRILL_NEON_API_KEY }}
        run: bash tooling/ci/restore-drill-neon.sh delete

  resolve-success:
    name: Close ci-failure issue
    needs: [resolve-environment, restore-smoke]
    if: always() && needs.restore-smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout the ci-failure-issue action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .github/actions/ci-failure-issue
      - name: Close the open ci-failure issue
        uses: ./.github/actions/ci-failure-issue
        with:
          mode: close
          title: Weekly restore smoke failing
          close-comment: The weekly restore smoke is green again — closing automatically.

  alert-on-failure:
    name: Alert on drill failure
    needs: [resolve-environment, restore-smoke]
    if: failure() || contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the fix plan reads the failed jobs and their logs
      contents: read
      issues: write
    steps:
      - name: Emit workflow failure notice
        run: |
          echo "::error title=Weekly restore smoke failed::Review docs/process/backup-drills.md — weekly drill validates migrate + the restore smoke on a restored Neon PITR branch."

      - name: Checkout the ci-failure-issue action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .github/actions/ci-failure-issue
      - name: Open or update ci-failure issue
        # The annotation above reaches only someone already on the Actions tab; an issue sends a
        # real notification, and the next green drill closes it.
        uses: ./.github/actions/ci-failure-issue
        with:
          mode: open
          title: Weekly restore smoke failing
          body: |
            The weekly restore drill failed: migrate or the restore smoke (`pnpm db:restore:smoke`) on a
            restored Neon point-in-time branch did not pass. Runbook: docs/process/backup-drills.md.
            The next green drill closes this issue.
