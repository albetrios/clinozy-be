# RLS parity canary — nightly DB suites under the PRODUCTION role posture.
#
# Why this exists: the PR lanes run the DB suites against the CI service
# container's superuser (the Compose `POSTGRES_USER`), which Postgres exempts from RLS entirely —
# the exact masking that hid eight production bugs (silent audit-log loss,
# broken account/org deletion, no-op retention) until local parity exposed
# them in Aug 2026. This canary re-runs the DB-bound suites nightly with the
# role taxonomy provisioned the way production runs: fixtures as
# `clinozy_be_operator` (BYPASSRLS, harness-only), maintenance contexts on a real
# `clinozy_be_maintenance` pool (RLS-SUBJECT), and the security suites'
# `SET LOCAL ROLE clinozy_be_app` exercising real policies. A regression in any
# policy arm, WITH CHECK, RETURNING visibility, or plan shape that only bites
# RLS-subject roles becomes a next-morning ci-failure issue instead of a
# first-deployment surprise. Companion canaries: scheduled-main-canary.yml
# (static slice), scheduled-chaos.yml (fault injection).
name: RLS parity canary

on:
  schedule:
    - cron: '45 1 * * *' # nightly 01:45 UTC — between the quality canary and the k6 run
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ${{ vars.FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 || 'true' }}

permissions:
  contents: read

concurrency:
  group: rls-parity-canary
  cancel-in-progress: false

jobs:
  parity:
    name: DB suites as RLS-subject roles (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The four suites ran one after another in one job and outgrew its 45-minute budget (run
    # 39008877908, 17 Oct: unit-db 4.9 min, e2e 4.8, integration 24.4, security cut off after
    # 10.6), so they run as parallel jobs: unit-db; security as the PR DB lanes slice it
    # (`VITEST_SECURITY_SLICE`: the permission route matrix, then the rest); and e2e +
    # integration in the PR application-role lane's four domain groups (`VITEST_DOMAIN_FILTER`).
    # The groups cover every domain plus `rest` exactly once — pinned by
    # src/tests/unit/ci/db-shard-balance.policy.unit.test.ts. Each job migrates and provisions
    # its own database; the canary is red if any job is.
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: unit-db
            suite: unit-db
          - group: security-permission-matrix
            suite: security
            security_slice: matrix
          - group: security-rest
            suite: security
            security_slice: rest
          - group: app
            suite: e2e-integration
            domains: app
          - group: tenancy-upload-audit
            suite: e2e-integration
            domains: tenancy,upload,audit
          - group: auth-billing
            suite: e2e-integration
            domains: auth,billing
          - group: rest-user-notify
            suite: e2e-integration
            domains: rest,user,notify
    services:
      postgres:
        image: postgres:17.10-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: clinozy
          POSTGRES_PASSWORD: clinozy
          POSTGRES_DB: clinozy
        options: >-
          --health-cmd="pg_isready -U clinozy -d clinozy"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:8.6.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Pin the harness runtime like every other vitest workflow (see
      # reusable-vitest-postgres-redis.yml): without it Vitest injects NODE_ENV=test
      # into its own process, the `pnpm db:migrate` child spawned by
      # src/tests/global-setup.ts inherits it, and the env schema
      # (local | development | production) fails the run before any suite executes.
      # CI has no .env files to rescue it the way a developer's .env.local does.
      NODE_ENV: development
      # Migrations run as the bootstrap superuser (fresh database, roles do not
      # exist yet — same as a fresh clone locally).
      DATABASE_MIGRATION_URL: postgresql://clinozy:clinozy@localhost:5432/clinozy
      # The harness pool: clinozy_be_operator (owner-member + BYPASSRLS), matching
      # the local parity model — fixtures and TRUNCATE work, while every context
      # wrapper still arms real GUCs and the SET LOCAL ROLE suites drop to the
      # RLS-subject clinozy_be_app.
      DATABASE_URL: postgresql://clinozy_be_operator:parity-canary@localhost:5432/clinozy
      DATABASE_OPERATOR_URL: postgresql://clinozy_be_operator:parity-canary@localhost:5432/clinozy
      # Maintenance contexts on the dedicated RLS-SUBJECT role — the posture the
      # hosted runbook provisions.
      DATABASE_MAINTENANCE_URL: postgresql://clinozy_be_maintenance:parity-canary@localhost:5432/clinozy
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Vitest's results cache, as in the PR vitest lanes: each file's last duration and
      # result, so a run starts the slowest and the last-failed files first. It holds no
      # transforms — each job transforms its files cold, the way every CI lane does. One key
      # per group, so the seven jobs do not race to save one entry.
      - name: Cache Vitest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules/.vite/vitest
          key: vitest-rls-parity-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            vitest-rls-parity-${{ runner.os }}-${{ matrix.group }}-

      - name: Export shared CI test env (JWT keys + secrets-encryption + origins)
        uses: ./.github/actions/test-env

      # Like every DB lane: no crash safety on a throwaway database. Durability is not part of
      # the role posture this canary checks.
      - uses: ./.github/actions/tune-ci-postgres
        with:
          container: ${{ job.services.postgres.id }}

      - name: Run migrations (bootstrap superuser — creates the role taxonomy)
        run: pnpm db:migrate

      - name: Provision role logins (CI equivalent of the local parity provisioning)
        # Passwords are throwaway job-local values for an ephemeral service
        # container — not secrets. BYPASSRLS requires the superuser, exactly as
        # the maintenance-database-role runbook documents for local provisioning.
        env:
          PGPASSWORD: clinozy
        run: |
          set -euo pipefail
          psql -h localhost -U clinozy -d clinozy <<'SQL'
          ALTER ROLE clinozy_be_operator LOGIN BYPASSRLS PASSWORD 'parity-canary';
          ALTER ROLE clinozy_be_maintenance LOGIN PASSWORD 'parity-canary';
          ALTER ROLE clinozy_be_app LOGIN PASSWORD 'parity-canary';
          SQL

      - name: unit-db (RLS-subject maintenance pool + operator fixtures)
        if: matrix.suite == 'unit-db'
        run: pnpm vitest run --project unit-db

      - name: e2e
        if: matrix.suite == 'e2e-integration'
        env:
          VITEST_DOMAIN_FILTER: ${{ matrix.domains }}
        run: pnpm test:e2e

      - name: integration
        if: matrix.suite == 'e2e-integration'
        env:
          VITEST_DOMAIN_FILTER: ${{ matrix.domains }}
        run: pnpm test:integration

      - name: security (SET LOCAL ROLE clinozy_be_app suites)
        if: matrix.suite == 'security'
        env:
          VITEST_SECURITY_SLICE: ${{ matrix.security_slice }}
        run: pnpm test:security

  resolve-success:
    name: Close ci-failure issue
    needs: [parity]
    if: always() && needs.parity.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout the ci-failure-issue action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .github/actions/ci-failure-issue
      - name: Close the open ci-failure issue
        uses: ./.github/actions/ci-failure-issue
        with:
          mode: close
          title: RLS parity canary failing
          close-comment: RLS parity canary is green again — closing automatically.

  notify-failure:
    name: Notify failure
    needs: [parity]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout the ci-failure-issue action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .github/actions/ci-failure-issue
      - name: Open or update ci-failure issue
        uses: ./.github/actions/ci-failure-issue
        with:
          mode: open
          title: RLS parity canary failing
          body: |
            The DB suites are red under the PRODUCTION role posture (operator fixtures +
            RLS-subject maintenance pool + SET LOCAL ROLE clinozy_be_app) while the superuser
            PR lanes may still be green — this is the RLS-masking bug class.

            Reproduce locally (parity is already provisioned per the
            maintenance-database-role runbook): run the DB suites normally — the local
            harness uses the same operator/maintenance roles.
            Check first: NEW-row SELECT visibility, RETURNING visibility, missing
            WITH CHECK bypass arms, MATERIALIZED locking CTEs (the be-rls-tenant-isolation-guard
            skill checklist).