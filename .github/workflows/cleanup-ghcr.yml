name: Cleanup GHCR images

# Weekly prune of stale GHCR manifests. Preserves floating convenience tags
# (:latest, plus :current / :previous — the live image and the rollback target, which
# tooling/ci/rotate-live-image-tags.sh reads), the immutable release tags (:vX.Y.Z — the release traceability
# alias for released production images), and the most recent SHA-tagged images.

on:
  schedule:
    - cron: '30 5 * * 0'
  workflow_dispatch:
    inputs:
      retain_sha_count:
        description: Number of SHA-tagged images to retain per repository
        required: false
        default: '30'
      dry_run:
        description: List what would be pruned and delete nothing
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ${{ vars.FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 || 'true' }}
  RETAIN_SHA_COUNT: ${{ inputs.retain_sha_count || '30' }}
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

jobs:
  cleanup:
    name: Prune GHCR manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        package:
          - clinozy-be-api
          - clinozy-be-worker
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prune stale manifests
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ matrix.package }}
          REPOSITORY: ${{ github.repository }}
          RETAIN: ${{ env.RETAIN_SHA_COUNT }}
        run: |
          set -euo pipefail
          # The build pushes ghcr.io/<owner>/<repository>/<image>, so GHCR names the package
          # "<repository>/<image>" (the slash URL-encoded in the API path), and the packages API
          # files it under /orgs/ or /users/ by the owner's account type.
          owner_type="$(gh api "/repos/${REPOSITORY}" --jq '.owner.type')"
          if [ "${owner_type}" = "Organization" ]; then owner_scope="orgs"; else owner_scope="users"; fi
          repository_name="$(printf '%s' "${REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          package_path="/${owner_scope}/${OWNER}/packages/container/${repository_name}%2F${PACKAGE}"
          echo "Cleaning ${repository_name}/${PACKAGE} (${owner_scope}) — retaining ${RETAIN} SHA tags plus :latest/:current/:previous/:vX.Y.Z/:deploy-failed-* (dry run: ${DRY_RUN})"

          versions="$(
            gh api "${package_path}/versions?per_page=100" \
              --paginate \
              --jq '.[] | select(.metadata.container.tags | length > 0) | {id: .id, tags: (.metadata.container.tags | join(","))}' \
              | jq -s '.'
          )"

          if [ "$(jq 'length' <<< "${versions}")" -eq 0 ]; then
            echo "No tagged versions found for ${PACKAGE}."
            exit 0
          fi

          # Never prune release tags (:vX.Y.Z — the immutable release traceability alias) or the
          # :latest/:current/:previous/:deploy-failed-* tags. :current is the live image even when it
          # is not the newest build (after a rollback, or an image_override deploy) — pruning it would
          # leave the next tag rotation without a :current and :previous stale.
          protected_regex='(^|,)(latest|current|previous|v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?|deploy-failed-[^,]+)(,|$)'
          deleted=0
          failed=0
          kept_sha=0

          while IFS= read -r row; do
            version_id="$(jq -r '.id' <<< "$row")"
            tags="$(jq -r '.tags' <<< "$row")"
            if echo "$tags" | grep -Eq "${protected_regex}"; then
              echo "Keeping protected tags: ${tags}"
              continue
            fi
            if echo "$tags" | grep -Eq '(^|,)[0-9a-f]{40}(,|$)'; then
              if [ "$kept_sha" -lt "$RETAIN" ]; then
                kept_sha=$((kept_sha + 1))
                echo "Keeping SHA tag set: ${tags}"
                continue
              fi
            fi
            if [ "${DRY_RUN}" = "true" ]; then
              echo "Would delete version ${version_id} (${tags})"
              deleted=$((deleted + 1))
              continue
            fi
            echo "Deleting version ${version_id} (${tags})"
            if gh api --method DELETE "${package_path}/versions/${version_id}"; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
              echo "::warning::Could not delete version ${version_id} (${tags})"
            fi
          done < <(jq -c '.[]' <<< "${versions}")

          echo "Cleanup complete for ${repository_name}/${PACKAGE}: deleted=${deleted}, failed=${failed}, kept_sha=${kept_sha} (dry run: ${DRY_RUN})"
          if [ "${failed}" -gt 0 ]; then
            echo "::error::${failed} version(s) of ${repository_name}/${PACKAGE} could not be deleted"
            exit 1
          fi
